                title: Staff Sign-In Required
                status: 401
                detail: No valid staff sign-in (the gateway answers).
                instance: /customers/ACME
        '404':
          description: No customer with this id exists.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/problemDetail'
              example:
                type: https://github.com/azure-intelligence-domain/experience-api-customer-service/blob/main/docs/problems/not-found.md
                title: Customer Not Found
                status: 404
                detail: No customer with this id exists.
                instance: /customers/ACME
        '502':
          description: A Process or System API behind the gateway failed; try again later.
