openapi: 3.0.3
info:
  title: '[Channel] Customer Service Experience API'
  version: 1.0.0
  description: 'Customer service, for people in the customer portal and for AI agents through the agent gateway:
    any customer at a glance, any order with everything every domain knows about it (SAP sales order and invoices,
    the warehouse reservation, the 3PL booking and shipment, every fact on its timeline), and the commands support
    may give. The order domain decides (ADR 0017).'
  contact:
    name: Channel Team
    url: https://github.com/azure-intelligence-domain/experience-api-customer-service
  license:
    name: MIT
    url: https://github.com/azure-intelligence-domain/experience-api-customer-service/blob/main/LICENSE
  x-gateway: other
x-gateway: other
externalDocs:
  description: EventCatalog entry of the channel domain
  url: https://azure-intelligence-domain.github.io/eventcatalog/docs/domains/channel/1.0.0
servers:
- url: https://apim-intplat-demo.azure-api.net/customer-service
  description: Main gateway, for staff signed in with Google through the customer portal. No version in the URI.
- url: https://apim-intplat-agents.azure-api.net/customer-service
  description: 'Gateway for AI agents: Entra ID token per agent, every call audited.'
security:
- staffToken: []
- platformToken: []
- subscriptionKey: []
  agentToken: []
tags:
- name: Customer Service
  description: Customers and their orders, for support.
paths:
  /customers:
    x-summary: Retrieve List of Customers
    get:
      tags:
      - Customer Service
      operationId: retrieveListOfCustomers
      summary: Retrieve List of Customers
      description: All customers.
      parameters:
      - $ref: '#/components/parameters/correlationId'
      responses:
        '200':
          description: The customers.
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/customerList'
              example:
                _links:
                  self:
                    href: /customers
                totalCount: 1
                _embedded:
                  customers:
                  - _links:
                      self:
                        href: /customers/ACME
                      orders:
                        href: /orders?customerId=ACME
                    customerId: ACME
                    name: ACME Corporation
                    industry: Manufacturing
                    shippingAddress:
                      street: Rue de la Loi 16
                      postalCode: '1000'
                      city: Brussels
                      countryCode: BE
                    currency: EUR
        '400':
          description: The request does not match the contract, or the Correlation-Id header is missing or invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/problemDetail'
              example:
                type: https://github.com/azure-intelligence-domain/experience-api-customer-service/blob/main/docs/problems/invalid-request.md
                title: Invalid Request
                status: 400
                detail: The request does not match the contract, or the Correlation-Id header is missing or invalid.
                instance: /customers
        '401':
          description: No valid staff sign-in (the gateway answers).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/problemDetail'
              example:
                type: https://github.com/azure-intelligence-domain/integration-platform/blob/main/docs/problems/staff-sign-in-required.md
                title: Staff Sign-In Required
                status: 401
                detail: No valid staff sign-in (the gateway answers).
                instance: /customers
        '502':
          description: A Process or System API behind the gateway failed; try again later.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/problemDetail'
              example:
                type: https://github.com/azure-intelligence-domain/experience-api-customer-service/blob/main/docs/problems/downstream-failure.md
                title: Downstream Failure
                status: 502
                detail: A Process or System API behind the gateway failed; try again later.
                instance: /customers
      x-business-keys: {}
  /customers/{customerId}:
    x-summary: Retrieve Customer
    get:
      tags:
      - Customer Service
      operationId: retrieveCustomer
      summary: Retrieve Customer
      description: 'A customer at a glance: its orders by status, what it still owes, its newest orders.'
      parameters:
      - $ref: '#/components/parameters/customerId'
      - $ref: '#/components/parameters/correlationId'
      responses:
        '200':
          description: The customer.
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/customerOverview'
              example:
                _links:
                  self:
                    href: /customers/ACME
                  orders:
                    href: /orders?customerId=ACME
                customerId: ACME
                name: ACME Corporation
                industry: Manufacturing
                shippingAddress:
                  street: Rue de la Loi 16
                  postalCode: '1000'
                  city: Brussels
                  countryCode: BE
                currency: EUR
                orderCount: 3
                ordersByStatus:
                  completed: 1
                  shipped: 1
                  cancelled: 1
                openAmount:
                  value: 84000.0
                  currency: EUR
                recentOrders:
                - _links:
                    self:
                      href: /orders/4711
                  orderId: '4711'
                  customerId: ACME
                  channel: webshop
                  status: shipped
                  paymentStatus: invoiced
                  totalAmount:
                    value: 84000.0
                    currency: EUR
                  createdAt: '2026-10-03T09:12:00Z'
                  updatedAt: '2026-10-04T07:30:02Z'
                  lineCount: 1
                  trackingNumber: SPD4711BE
